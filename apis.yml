aid: konn-technologies
name: Konn Technologies
description: Konn Technologies is an Amman, Jordan based design and construction technology company, founded
  in 2020, that builds three integrated systems for a new model of homeownership - a composable architectural
  design language, an industrialized construction methodology using reinforced concrete and insulated
  sealed envelopes, and a software platform connecting the entire homeowner journey from first idea to
  keys in hand. Its consumer brand, Konn (konnhomes.com), sells that system directly to homeowners through
  a productized ladder - DesignFit, a 300 JOD ten-day land assessment producing 2D layouts, a site plan,
  and a budget and timeline; ArchDesign, a 4,000 JOD 3D design with a locked-in construction price; and
  Konnify, which adapts a design a homeowner already commissioned from an outside architect onto the Konn
  engineering system. Customer-facing software includes a Design Studio for browsing floor types, sizes,
  and styles with plans and pricing, and a Design Match tool that recommends a home design from stated
  requirements. The company reports 100+ homes designed and 35+ homes built, with typical permit-to-move-in
  timelines of three to six months. It publishes no public developer API, developer portal, or machine-readable
  API artifacts as of this enrichment pass.
